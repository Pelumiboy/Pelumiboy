<!DOCTYPE html>
<html>
<head>
<title>Dashboard Table</title>

<style>

body{
font-family:Segoe UI, sans-serif;
background:linear-gradient(135deg,#141e30,#243b55);
margin:0;
padding:40px;
color:white;
}

.container{
width:85%;
margin:auto;
background:rgba(255,255,255,0.05);
padding:25px;
border-radius:12px;
backdrop-filter:blur(8px);
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

h2{
margin-bottom:20px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.search{
padding:10px;
border:none;
border-radius:6px;
width:220px;
outline:none;
}

.export{
background:#4CAF50;
border:none;
padding:10px 16px;
color:white;
border-radius:6px;
cursor:pointer;
}

.export:hover{
background:#45a049;
}

table{
width:100%;
border-collapse:collapse;
overflow:hidden;
}

th, td{
padding:14px;
text-align:center;
}

th{
background:rgba(255,255,255,0.1);
text-transform:uppercase;
font-size:13px;
cursor:pointer;
}

th:hover{
background:rgba(255,255,255,0.2);
}

tr{
border-bottom:1px solid rgba(255,255,255,0.1);
animation:fadein 0.6s ease;
}

tr:hover{
background:rgba(255,255,255,0.12);
transform:scale(1.01);
transition:0.3s;
}

td{
color:#ddd;
}

.pagination{
margin-top:20px;
text-align:center;
}

.page{
display:inline-block;
padding:8px 14px;
margin:4px;
background:rgba(255,255,255,0.1);
border-radius:6px;
cursor:pointer;
}

.page:hover{
background:#4CAF50;
}

@keyframes fadein{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="container">

<h2>Student Dashboard</h2>

<div class="top-bar">

<input class="search" placeholder="Search student...">

<button class="export">Export</button>

</div>

<table>

<tr>
<th>ID ↑↓</th>
<th>Name ↑↓</th>
<th>Course ↑↓</th>
<th>Score ↑↓</th>
</tr>

<tr>
<td>1</td>
<td>Pelumi</td>
<td>Computer Science</td>
<td>85</td>
</tr>

<tr>
<td>2</td>
<td>Joy</td>
<td>Engineering</td>
<td>90</td>
</tr>

<tr>
<td>3</td>
<td>David</td>
<td>Medicine</td>
<td>78</td>
</tr>

<tr>
<td>4</td>
<td>Sarah</td>
<td>Law</td>
<td>88</td>
</tr>

<tr>
<td>5</td>
<td>Daniel</td>
<td>Business</td>
<td>82</td>
</tr>

</table>

<div class="pagination">

<span class="page">1</span>
<span class="page">2</span>
<span class="page">3</span>
<span class="page">Next</span>

</div>

</div>

</body>
</html>
